<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JJ Woollen | YarnVault</title>
    <link rel="stylesheet" href="style.css">
    <script src="pages/dashboard.js" defer></script>
    <script src="pages/inventory.js" defer></script>
    <script src="pages/addBale.js" defer></script>
    <script src="pages/sales.js" defer></script>
    <script src="pages/analytics.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="logo-section">
                <h2 class="logo-main">JJ WOOLLEN</h2>
                <div class="logo-sub">INDUSTRIES</div>
            </div>
            
            <div class="menu">
                <div class="nav-item" data-page="dashboard" onclick="navigate('dashboard')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                    Dashboard
                </div>
                <div class="nav-item" data-page="add" onclick="navigate('add')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    Add Bale
                </div>
                <div class="nav-item" data-page="inventory" onclick="navigate('inventory')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                    Inventory
                </div>
                <div class="nav-item" data-page="sales" onclick="navigate('sales')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                    Sales
                </div>
                <div class="nav-item" data-page="analytics" onclick="navigate('analytics')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                    Analytics
                </div>
            </div>

            <div class="sidebar-footer">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="avatar">A</div>
                    <div>
                        <div style="color:var(--text-muted); font-size: 0.7rem;">Logged in as</div>
                        <div style="font-weight:600">admin</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="main">
            <div id="content"></div>
        </div>
    </div>
</body>
</html>
